[project]
name = "venom"
version = "0.1.0"
description = "Venom — the Raspberry Pi wearable runtime of FLINT (appliance daemon)"
requires-python = ">=3.11"
# The monitoring core is stdlib-only; the voice assistant needs the extras.
dependencies = [
    "chess>=1.11",  # voice chess: board state, legality, SAN/UCI parsing
]

[project.optional-dependencies]
voice = [
    "flint-core",          # shared memory store, tool registry, LLM providers
    "google-genai>=1.0",   # Gemini Live audio sessions
    "requests>=2.31",
    "sounddevice>=0.5",
    "numpy>=1.26,<2.5",
    "scipy>=1.11",         # audio/denoise.py: the high-pass biquad
    "icalendar>=5.0",              # calendar: parse the secret .ics feed
    "recurring-ical-events>=2.1",  # calendar: expand RRULE recurrences
    "tinytuya>=1.13",              # smart lights: local LAN control of Tuya bulbs
    "samsungtvws>=2.6",            # TV: Samsung Tizen remote over the LAN
    # On Linux, openwakeword hard-requires tflite-runtime, which has no
    # wheels for modern Python — provision.sh installs it there with
    # --no-deps instead. Declared only where it resolves cleanly.
    'openwakeword>=0.6; platform_system == "Windows"',
    "onnxruntime>=1.20,<1.22",
]

[project.scripts]
venom = "venom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# web.py embeds the console's HTML and CSS as string literals. Those are
# minified on purpose — it is one page served off a 2 GB Pi — and rewrapping
# markup to satisfy a Python line-length rule makes the markup worse to read
# without making the Python any better.
# Globbed rather than a fixed relative path: CI lints once from the repo
# root with --config and once from inside venom/, and the path ruff
# matches against differs between the two.
"**/venom/web.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["venom", "flint_core"]
