[project]
name = "venom"
version = "0.1.0"
description = "Venom — the Raspberry Pi wearable runtime of FLINT (appliance daemon)"
requires-python = ">=3.11"
dependencies = []            # stdlib only, by design: 2 GB Pi, minimal footprint

[project.scripts]
venom = "venom.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
