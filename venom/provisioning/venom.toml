# Venom appliance configuration — installed to /etc/venom/venom.toml on first
# provision. Edit on the Pi (or before flashing) and `systemctl restart venom`.

[venom]
poll_interval = 30.0     # seconds between health cycles (was 10 — too aggressive, flapped the brain)
probe_timeout = 5.0      # seconds per reachability probe (was 3 — too tight for India->US latency)
status_path = "/run/venom/status.json"
memory_path = "/var/lib/venom/memory.json"

[gemini]
# Baked in by prepare-pendrive.ps1 -GeminiApiKey. Required for voice.
api_key = ""

[audio]
# "auto" uses bluetooth when a headset is configured below, else USB.
output = "auto"
# Baked in by prepare-pendrive.ps1 (auto-detected from your laptop or via
# -BluetoothMac / -BluetoothName). First boot: put the headset in pairing
# mode near the Pi once; it is trusted and reconnects automatically forever.
bluetooth_mac = ""
bluetooth_name = ""
# Bluetooth receive: say "pair my laptop" and the Pi turns discoverable as a
# Bluetooth headset named 'venom' for ~2 minutes — the laptop/phone's audio
# then plays through the earphone, and its calls can use the earphone mic.
# Venom's own voice keeps working throughout. Set false to disable entirely.
receiver = true
# Bluetooth focus: while the laptop/phone is actively streaming, Venom goes
# radio-quiet (no pre-warmed Gemini session, wake word off) so the shared
# 2.4GHz radio belongs to the music — kicks in within ~3s of audio starting.
# The wake button or a console prompt breaks in (she takes ~4s to reply,
# cold session); the stream ending restores normal listening automatically.
receiver_focus = true

[voice]
enabled = true
wake_word = "hey_jarvis"       # say "Hey Jarvis" to wake Venom
wake_threshold = 0.30
inactivity_timeout = 45.0      # seconds of silence before going back to sleep
endpoint_silence_ms = 500      # silence after you speak before Venom replies (lower = snappier)
thinking_budget = -1           # -1 = model's own default (native-audio replies worse with it off); 0 = force off
affective_dialog = false       # OFF by default: forces the slower v1alpha endpoint (latency). Set true to trade snappiness for emotion-aware tone.
proactive_audio = false        # let her decide when NOT to reply (more human, adds a decision beat -> less snappy)
# temperature = 1.1            # uncomment to add natural variety; leave unset for the model default
live_model = "models/gemini-2.5-flash-native-audio-preview-12-2025"
voice_name = "Leda"            # warm female voice for Hinglish (Gemini prebuilt set)
user_name = "Boss"
language = "en"

[internet]
host = "1.1.1.1"
port = 53

# ── Physical buttons ─────────────────────────────────────────────────────────
# Both the headset inline button and shutter button 2 wake Venom (+ pause music
# for the command). The Bluetooth camera-shutter remote's two buttons are
# identified by their evdev key code. Leave 0 until you know them: press a button
# once and the journal logs `venom.buttons: button: unmapped key code N`.
[buttons]
dnd_code  = 115  # shutter button 1 (Volume-Up)   = KEY_VOLUMEUP   → DND toggle
wake_code = 114  # shutter button 2 (Volume-Down) = KEY_VOLUMEDOWN → wake Venom
# NB: keep the shutter's iOS/Android switch in the position where the buttons
# send volume up/down — flipping it changes these codes.

# ── Web console ──────────────────────────────────────────────────────────────
# The browser console includes a ROOT SHELL, so treat its reachability as
# root access to the whole device. Default: bound to loopback only — reach it
# over an SSH tunnel (`ssh -L 8787:localhost:8787 <user>@venom.local`) or over
# Tailscale, never on raw Wi-Fi the Pi roams onto. The access PIN is generated
# on first provision (`sudo cat /var/lib/venom/web_token`).
# Set bind = "0.0.0.0" ONLY on a network you fully trust (e.g. your own home
# Wi-Fi) and never on a public/shared/hotspot network.
[web]
bind = "127.0.0.1"

# ── Find my phone (ntfy) ─────────────────────────────────────────────────────
# "Find my phone" / "ring my phone" (spoken) sends a max-priority push to this
# ntfy topic. Install the ntfy app on your phone, subscribe to the same topic,
# and give it a loud/alarm sound so it rings even on silent. Off until a topic
# is set.
#
# SECURITY: ntfy.sh topics are PUBLIC — the topic name is the only secret.
# Anyone who learns it can read everything pushed here (incoming WhatsApp,
# photos) AND publish fake messages Venom will read out. So:
#   - Use a long, unguessable random name (e.g. `openssl rand -hex 12`).
#   - NEVER commit the real topic to git. Leave this blank in the repo and set
#     it only in the on-device /etc/venom/venom.toml, or self-host ntfy with auth.
[phone]
ntfy_server = "https://ntfy.sh"
ntfy_topic  = ""   # set a long random topic ON THE DEVICE; keep it out of git

# ── Smart lights (Tuya / Smart Life) ─────────────────────────────────────────
# Voice control of Tuya/Smart Life colour+brightness bulbs (Wipro, Syska,
# Halonix, Havells, most generic Wi-Fi bulbs), driven LOCALLY over your Wi-Fi —
# no cloud round-trip. Say "lights on", "bedroom 20%", "make it warm white",
# "movie mode", "sab lights off".
#
# ONE-TIME SETUP (extract each bulb's local key — Tuya encrypts LAN control):
#   1. Make a free Tuya IoT Cloud project at iot.tuya.com and link your
#      Smart Life app account to it (Devices → Link App Account → scan the QR
#      in Smart Life → Me → Tuya Developer). This is the fiddly part; it's a
#      one-time account link, done off the Pi.
#   2. On any computer: `pip install tinytuya` then `python -m tinytuya wizard`.
#      Enter the project's API ID/Secret + your region; it writes devices.json
#      (and snapshot.json) holding each bulb's id, local key and IP.
#   3. Copy that file to the Pi as the registry_path below, e.g.
#        scp devices.json <user>@venom.local:/tmp/ &&
#        sudo mv /tmp/devices.json /var/lib/venom/lights.json &&
#        sudo chown venom:venom /var/lib/venom/lights.json
#   4. Optional: add a "room" field to each entry (e.g. "room": "bedroom") so
#      "turn off the bedroom" groups the right bulbs. You can name lights too.
#
# SECURITY: the local keys grant control of your bulbs — keep lights.json on the
# Pi only, never in git. Lights are OFF (tools hidden) until the file exists
# with at least one keyed bulb. Set enabled = false to hard-disable.
[lights]
enabled       = true
registry_path = "/var/lib/venom/lights.json"

# ── TV (Samsung / Tizen) ─────────────────────────────────────────────────────
# Venom drives a Samsung smart TV over the LAN: power, volume, mute, remote
# buttons, and opening apps ("Netflix kholo", "pause karo", "volume kam karo").
#
# SETUP
#   1. host — the TV's IP. TV menu -> Settings -> General -> Network -> Network
#      Status -> IP Settings. Give it a DHCP reservation on your router, since
#      a moved TV just looks offline.
#   2. mac — the MAC on that same screen. ONLY needed to switch the TV *on*:
#      with the panel off its WebSocket is off too, so Wake-on-LAN is the only
#      way in. Also turn ON Settings -> General -> Power and Energy Saving ->
#      Network Standby, or the TV won't listen for the wake packet.
#   3. First command prompts "Allow Venom to connect?" on the TV — accept it
#      once. The token is saved to token_path so it never asks again. If it
#      keeps asking: Settings -> General -> External Device Manager -> Device
#      Connection Manager -> Access Notification -> "First Time Only".
#   4. The Pi and the TV must be on the SAME subnet — Samsung refuses
#      WebSocket connections across VLANs, and a guest Wi-Fi counts as one.
#
# Exact volume ("TV volume 20") goes over UPnP on port 9197, which not every
# model serves; up/down always works. Tools are hidden until host is set.
[tv]
enabled    = true
host       = ""            # e.g. "192.168.1.42"
mac        = ""            # e.g. "AA:BB:CC:DD:EE:FF" — needed for power-on
name       = "Venom"       # the name the TV shows in its device list
port       = 8002          # 8002 = TLS (2018+ models); older sets use 8001
timeout    = 5.0
token_path = "/var/lib/venom/tv-token.txt"

# ── Delegated watches (she goes away and reports back) ───────────────────────
# "Tell me when the match turns." "Batao jab result aa jaye." She checks on a
# schedule in the background and OPENS a conversation the moment it happens —
# then forgets the watch. Say "what are you watching?" / "stop watching X".
#
# COSTS MONEY: every check is a grounded web search plus a small verdict call,
# so the limits are deliberately tight and live in venom/watch.py (WatchStore):
# at most 5 watches at once, never faster than every 2 minutes, 120 checks and
# 24 hours per watch by default. A watch that never fires dies quietly.
#
# A watch that fires during [ambient] quiet hours holds its result and delivers
# it when quiet hours end — unless it was set up as urgent. Needs the Gemini
# key; off automatically without one.
[watch]
enabled      = true
tick_seconds = 60.0        # how often the loop looks for due work

# ── Background jobs ──────────────────────────────────────────────────────────
# Work that outlives the conversation that asked for it: "go research this
# properly and tell me". She plans the searches, runs them over several minutes,
# writes the answer up, and opens a fresh conversation to give it to you.
#
# COSTS MONEY, like watches, and is bounded the same way: the per-job-type
# budgets (how many steps, how long, how many at once) live in venom/jobs.py so
# they are a deliberate decision rather than a config knob. Jobs are stored in
# /var/lib/venom/jobs.db and survive a reboot — one interrupted mid-step is
# picked back up rather than lost. Needs the Gemini key; off without one.
#
# A job finishing during [ambient] quiet hours, mid-conversation, or during DND
# holds its result until a decent moment, exactly like a watch.
[kernel]
enabled              = true
tick_seconds         = 30.0    # how often the loop looks for due work
max_running          = 2       # concurrent steps; a 2 GB Pi is not a server
keep_finished_hours  = 72.0    # how long a finished job stays readable

# ── Permissions & audit ──────────────────────────────────────────────────────
# Every tool call is permission-checked and written down. Permissions are
# declared by the capability that owns each tool (venom/capabilities.py):
# audio, network, messaging, personal_data, location, home_control,
# remote_control, camera, bluetooth, emergency, device_control.
#
# The default grants exactly what the ACTIVE capabilities ask for — this is
# your own device, and the point is a record plus an off-switch, not locking
# you out. Nothing you have configured stops working.
#
# `denied` always wins, and is the useful knob. To stop her messaging anyone
# (including SOS) while keeping everything else:
#     denied = ["messaging"]
# `granted` replaces the default with an explicit list, if you want default-deny.
#
# The audit log is append-only JSONL, rotated at 5000 lines. Read it with
# `tail -f /var/lib/venom/audit.jsonl`, or just ask her "what have you been
# doing?" (the recent_activity tool). It is a record, not a security boundary:
# anyone with root can rewrite it.
[permissions]
enabled    = true
granted    = []                            # empty = whatever capabilities need
denied     = []                            # always wins over granted
audit_path = "/var/lib/venom/audit.jsonl"

# ── Screen reading (OCR) ─────────────────────────────────────────────────────
# Run laptop/screen_server.py on your laptop, then say "look at my screen" and
# Jarvis reads the on-screen text (local OCR — fast, no vision API, text only).
# Off until you set host. See laptop/README.md.
[screen]
enabled = true
host    = ""              # laptop LAN/Tailscale address, e.g. "192.168.1.50"
port    = 8766
token   = ""              # must match the screen server's --token
timeout = 5.0             # seconds to wait for the OCR round-trip

# ── Laptop control (FLINT fusion) ────────────────────────────────────────────
# FLINT (the desktop assistant) runs on the laptop with its remote listener
# on ws://<host>:8765 (FLINT config: remote_port / remote_token). Say
# "open spotify on my laptop" and Venom hands FLINT the task and speaks back
# its reply. Use the laptop's mDNS name so IP changes don't matter.
# Off until host is set.
[laptop]
host    = ""              # e.g. "EXODUS.local"
port    = 8765
token   = ""              # must match FLINT's remote_token (api_keys.json)
timeout = 45.0            # seconds to wait for FLINT to finish a task

# ── Calendar & Gmail (zero-OAuth) ────────────────────────────────────────────
# Calendar: Google Calendar -> Settings -> your calendar -> "Secret address in
# iCal format". Read-only; Venom answers "what's on today?" and chimes
# lead_minutes before events. Mail: Gmail IMAP with an app password
# (myaccount.google.com -> Security -> App passwords; needs 2FA). Read-only —
# nothing is ever marked read. Both off until filled in.
[calendar]
ical_url     = ""
lead_minutes = 30

[mail]
address      = ""          # the Gmail address
app_password = ""          # 16-char app password (spaces ok)

# ── Camera (Raspberry Pi camera module) ──────────────────────────────────────
# Say "what do you see?" and Jarvis grabs a frame off the CSI camera and Gemini
# describes it (she's blind to images herself). "Take a photo" snaps a shot,
# sends it to your phone (ntfy), and describes it aloud. Needs the camera enabled
# in raspi-config and libcamera (rpicam-still) installed — both stock on Pi OS.
[camera]
enabled     = true
photo_topic = ""          # ntfy topic for photo pushes; empty = reuse [phone] ntfy_topic

# ── Ambient awareness (she speaks first) ─────────────────────────────────────
# Every few minutes Venom fuses what she knows — calendar, weather, unread
# mail, reminders, her own temperature and disk — and opens a conversation
# herself when the combination is actually worth it ("rain aa rahi hai and
# you've got that 4pm — chhata le lena"). She never opens one without
# something specific to say. The knobs below are all about restraint: quiet
# hours, a minimum gap, a per-topic cooldown and a daily cap. Every value is
# optional — deleting this whole section keeps the tuned defaults.
[ambient]
enabled               = true
tick_seconds          = 300     # how often she looks at the world
quiet_start_hour      = 23      # never speaks first from 23:00...
quiet_end_hour        = 7       # ...until 07:00
min_gap_minutes       = 45      # minimum spacing between two openings
kind_cooldown_minutes = 180     # per topic (weather / mail / device / ...)
max_per_day           = 6
mail_pileup           = 5       # unread count worth mentioning
temp_warn_c           = 80      # she tells you when *she's* overheating
disk_warn_pct         = 90

# ── Brain candidates, lowest priority number wins ────────────────────────────
# The laptop running the FLINT brain service. Update `host` to your laptop's
# LAN or Tailscale address. Priority 0 = always preferred when reachable.
[[brain]]
name = "laptop"
host = "192.168.1.50"
port = 8765
priority = 0

# Cloud fallbacks (reachability of the provider endpoint).
[[brain]]
name = "gemini"
host = "generativelanguage.googleapis.com"
port = 443
priority = 10

[[brain]]
name = "groq"
host = "api.groq.com"
port = 443
priority = 11

[[brain]]
name = "openai"
host = "api.openai.com"
port = 443
priority = 12

[[brain]]
name = "anthropic"
host = "api.anthropic.com"
port = 443
priority = 13

[[brain]]
name = "openrouter"
host = "openrouter.ai"
port = 443
priority = 14
