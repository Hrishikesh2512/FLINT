# Venom appliance configuration — installed to /etc/venom/venom.toml on first
# provision. Edit on the Pi (or before flashing) and `systemctl restart venom`.

[venom]
poll_interval = 10.0     # seconds between health cycles
probe_timeout = 3.0      # seconds per reachability probe
status_path = "/run/venom/status.json"
memory_path = "/var/lib/venom/memory.json"

[gemini]
# Baked in by prepare-pendrive.ps1 -GeminiApiKey. Required for voice.
api_key = ""

[cloud]
# Optional: back Venom's long-term memory up to Supabase so it survives a
# re-flash or a lost Pi. Baked in by prepare-pendrive.ps1 -SupabaseUrl /
# -SupabaseAnonKey / -MemoryPassphrase. Leave blank to keep memory local-only.
# The passphrase derives both the (opaque) cloud row id and the encryption
# key — the cloud only ever stores ciphertext. Re-flash with the SAME
# passphrase to restore your memory onto a fresh device.
supabase_url = ""
supabase_anon_key = ""       # PUBLISHABLE (anon) key only — never service-role
memory_passphrase = ""
backup_enabled = true

[audio]
# "auto" uses bluetooth when a headset is configured below, else USB.
output = "auto"
# Baked in by prepare-pendrive.ps1 (auto-detected from your laptop or via
# -BluetoothMac / -BluetoothName). First boot: put the headset in pairing
# mode near the Pi once; it is trusted and reconnects automatically forever.
bluetooth_mac = ""
bluetooth_name = ""

[voice]
enabled = true
wake_word = "hey_jarvis"       # say "Hey Jarvis" to wake Venom
wake_threshold = 0.30
inactivity_timeout = 45.0      # seconds of silence before going back to sleep
live_model = "models/gemini-2.5-flash-native-audio-preview-12-2025"
voice_name = "Leda"
user_name = "Boss"
language = "en"

[internet]
host = "1.1.1.1"
port = 53

# ── Brain candidates, lowest priority number wins ────────────────────────────
# The laptop running the FLINT brain service. Update `host` to your laptop's
# LAN or Tailscale address. Priority 0 = always preferred when reachable.
[[brain]]
name = "laptop"
host = "192.168.1.50"
port = 8765
priority = 0

# Cloud fallbacks (reachability of the provider endpoint).
[[brain]]
name = "gemini"
host = "generativelanguage.googleapis.com"
port = 443
priority = 10

[[brain]]
name = "groq"
host = "api.groq.com"
port = 443
priority = 11

[[brain]]
name = "openai"
host = "api.openai.com"
port = 443
priority = 12

[[brain]]
name = "anthropic"
host = "api.anthropic.com"
port = 443
priority = 13

[[brain]]
name = "openrouter"
host = "openrouter.ai"
port = 443
priority = 14
