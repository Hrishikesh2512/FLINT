  <circle cx="256" cy="256" r="132" fill="none" stroke="#7fd1c4" stroke-width="14" opacity=".35"/>
  <circle cx="256" cy="256" r="94" fill="none" stroke="#7fd1c4" stroke-width="18"/>
  <circle cx="256" cy="256" r="34" fill="#7fd1c4"/>
</svg>
