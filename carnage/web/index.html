<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Everything inline: the page is served by a stdlib HTTP server on a
     phone-adjacent machine, and a second round trip for 3 KB of CSS is a
     visible stall on a bad connection. */
  :root {
    --bg: #0b0d10;
    --panel: #141820;
    --line: #232a35;
    --ink: #e8ecf2;
    --dim: #8b97a8;
    --her: #7fd1c4;
    --him: #9db4ff;
    --warn: #f0b567;
    --bad: #f0776a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    overscroll-behavior-y: contain;
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--her); }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--dim); font-size: 12px; margin-left: auto; text-align: right; }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex;
         flex-direction: column; gap: 12px; }
  .turn { max-width: 82%; padding: 10px 13px; border-radius: 16px;
          white-space: pre-wrap; word-wrap: break-word; }
  .her { align-self: flex-start; background: var(--panel);
         border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .him { align-self: flex-end; background: #1b2740;
         border: 1px solid #263554; border-bottom-right-radius: 5px;
         color: var(--him); }
  .note { align-self: center; color: var(--dim); font-size: 13px;
          text-align: center; max-width: 90%; }
  .note.warn { color: var(--warn); }

  form { display: flex; gap: 8px; padding: 10px 12px
         calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
         background: var(--bg); }
  input, button {
    font: inherit; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 12px 14px;
  }
  input { flex: 1; min-width: 0; }
  input:focus { outline: 2px solid var(--him); outline-offset: -1px; }
  button { flex: none; font-weight: 600; }
  button:disabled { opacity: .45; }
  #mic[aria-pressed="true"] { background: #3a2130; border-color: var(--bad); }

  #outbox { padding: 0 16px; }
  #outbox a {
    display: block; margin: 8px 0; padding: 12px 14px; border-radius: 12px;
    background: #3a2b18; border: 1px solid var(--warn); color: var(--warn);
    text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Jarvis</h1>
    <span class="sub" id="sub">connecting…</span>
  </header>

  <div id="outbox" hidden></div>
  <div id="log"></div>

  <form id="say">
    <input id="text" placeholder="Say something…" autocomplete="off"
           enterkeyhint="send" autocapitalize="sentences">
    <button id="mic" type="button" aria-pressed="false" title="Speak">🎙</button>
    <button id="send" type="submit">Send</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
