name: Carnage APK

# Builds the phone app and attaches the APK to the run, so an installable
# build exists without an Android toolchain on anyone's machine. GitHub's
# runners already carry the SDK; this only adds the JDK and Gradle.
on:
  push:
    branches: [v2/rebuild]
    paths:
      - 'carnage/**'
      - 'packages/flint-core/**'
      - '.github/workflows/carnage-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs a host Python of the same version it bundles, to
      # resolve and cross-build the wheels that go into the APK.
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No gradle-wrapper.jar is committed — a binary in the tree that nobody
      # can read is a poor thing to ask reviewers to trust. The action pins the
      # version instead, which is the same guarantee written down.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: carnage/android
        run: gradle --no-daemon assembleDebug

      - name: Name it something installable
        run: |
          set -eu
          src=carnage/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$src"
          mkdir -p dist
          cp "$src" "dist/jarvis-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 60
