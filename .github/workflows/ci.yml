name: CI

on:
  push:
    branches: [production, v2/rebuild, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling + venom package
        run: |
          python -m pip install --quiet pytest ruff ./venom
      - name: Lint (correctness rules)
        run: |
          ruff check .
          ruff check venom/src venom/tests --config venom/pyproject.toml
      - name: Flint tests (platform-free modules)
        run: python -m pytest tests/
      - name: Venom tests
        run: python -m pytest venom/tests/
      - name: Shell script syntax
        run: |
          bash -n venom/provisioning/provision.sh
          bash -n venom/provisioning/install-firstboot.sh
