name: CI

on:
  push:
    branches: [production, v2/rebuild, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling + packages
        run: |
          python -m pip install --quiet pytest ruff
          # flint-core first: venom's `voice` extra depends on it by name, and
          # there is no such package on PyPI to fall back to.
          python -m pip install --quiet ./packages/flint-core
          # The `voice` extra, not the bare package: numpy, icalendar and
          # google-genai live there, and without them 14 tests fail on import
          # rather than on anything they were written to check.
          python -m pip install --quiet "./venom[voice]"
          python -m pip install --quiet ./carnage
      - name: Lint (correctness rules)
        run: |
          ruff check .
          ruff check venom/src venom/tests --config venom/pyproject.toml
      - name: Flint tests (platform-free modules)
        run: python -m pytest tests/
      - name: Venom tests
        run: python -m pytest venom/tests/
      - name: flint-core tests
        run: python -m pytest tests/
        working-directory: packages/flint-core

      - name: Carnage tests
        run: python -m pytest carnage/tests/
      - name: Shell script syntax
        run: |
          bash -n venom/provisioning/provision.sh
          bash -n venom/provisioning/install-firstboot.sh
