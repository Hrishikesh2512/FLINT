<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FLINT · Remote</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--one" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--two" aria-hidden="true"></div>

  <!-- ── Connectivity header ─────────────────────────────────────────── -->
  <header class="status-bar" id="statusBar" data-state="connecting">
    <div class="status-bar__brand">
      <span class="status-bar__logo">FL<span class="accent">!</span>NT</span>
      <span class="status-bar__sub">REMOTE CONSOLE</span>
    </div>
    <div class="status-bar__conn" id="connPill">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Connecting…</span>
    </div>
  </header>

  <main class="console">
    <!-- ── Tool deck ─────────────────────────────────────────────────── -->
    <section class="deck" aria-label="Tool deck">
      <h2 class="section-label">Tool Deck</h2>
      <div class="deck__grid">
        <button class="tile" data-action="browser_control" type="button">
          <span class="tile__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18" />
            </svg>
          </span>
          <span class="tile__title">Browser Control</span>
          <span class="tile__hint">Drive the web</span>
          <span class="tile__pulse" aria-hidden="true"></span>
        </button>

        <button class="tile" data-action="send_message" type="button">
          <span class="tile__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z" />
            </svg>
          </span>
          <span class="tile__title">WhatsApp</span>
          <span class="tile__hint">Send a message</span>
          <span class="tile__pulse" aria-hidden="true"></span>
        </button>

        <button class="tile" data-action="computer_control" type="button">
          <span class="tile__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3" y="4" width="18" height="13" rx="1.5" />
              <path d="M8 21h8M12 17v4" />
            </svg>
          </span>
          <span class="tile__title">System Macros</span>
          <span class="tile__hint">Desktop control</span>
          <span class="tile__pulse" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <!-- ── Voice engine ──────────────────────────────────────────────── -->
    <section class="voice" aria-label="Voice command">
      <h2 class="section-label">Voice Command</h2>

      <div class="mic-stage">
        <button class="mic" id="micBtn" type="button" aria-label="Hold to speak a command">
          <span class="mic__ring mic__ring--1" aria-hidden="true"></span>
          <span class="mic__ring mic__ring--2" aria-hidden="true"></span>
          <span class="mic__ring mic__ring--3" aria-hidden="true"></span>
          <span class="mic__core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7" />
            </svg>
          </span>
        </button>
      </div>

      <p class="mic-prompt" id="micPrompt">Tap the mic and speak your command</p>
      <div class="transcript" id="transcript" aria-live="polite"></div>
    </section>
  </main>

  <!-- ── Toast / log ─────────────────────────────────────────────────── -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Supabase JS (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App config (gitignored — copy from config.example.js) -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
